services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?Define GROQ_API_KEY en .env}
      GROQ_BILLING_MODEL: ${GROQ_BILLING_MODEL:-openai/gpt-oss-safeguard-20b}
      AGENT_BRIDGE_TOKEN: ${AGENT_BRIDGE_TOKEN:?Define un AGENT_BRIDGE_TOKEN aleatorio en .env}
      AGENT_DATABASE_PATH: /data/agent.sqlite3
      AGENT_SESSION_RETENTION_DAYS: ${AGENT_SESSION_RETENTION_DAYS:-90}
      FACTURACION_API_URL: ${FACTURACION_API_URL:-}
      FACTURACION_API_KEY: ${FACTURACION_API_KEY:-}
      FACTURACION_NUMEROS_AUTORIZADOS: ${FACTURACION_NUMEROS_AUTORIZADOS:-}
    volumes:
      - agent-data:/data
      - ./backups:/backups
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  bridge:
    build:
      context: ./puente_whatsapp
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      agent:
        condition: service_healthy
    environment:
      PORT: "3000"
      HOST: 0.0.0.0
      AGENT_API_URL: http://agent:8000/chat
      AGENT_BRIDGE_TOKEN: ${AGENT_BRIDGE_TOKEN:?Define un AGENT_BRIDGE_TOKEN aleatorio en .env}
      BRIDGE_DATA_DIR: /data/bridge
      WHATSAPP_PUBLIC_NUMBER: ${WHATSAPP_PUBLIC_NUMBER:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - agent-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  backup:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - maintenance
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    environment:
      AGENT_DATABASE_PATH: /data/agent.sqlite3
      AGENT_BACKUP_DIR: /backups
      BRIDGE_DATA_DIR: /data/bridge
      AGENT_SESSION_RETENTION_DAYS: ${AGENT_SESSION_RETENTION_DAYS:-90}
    volumes:
      - agent-data:/data
      - ./backups:/backups
    command: ["python", "-m", "facturacion.backup"]

volumes:
  agent-data:
